# Production Nginx configuration — single entrypoint for the whole stack.
# Routes /api/*, /docs, /redoc, /openapi.json to the backend; everything
# else to the Next.js frontend.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------- Logging ----------
    log_format main '$remote_addr - [$time_local] "$request" '
                     'status=$status bytes=$body_bytes_sent '
                     'referrer="$http_referer" ua="$http_user_agent" '
                     'rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ---------- General hardening / performance ----------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;                 # don't leak the nginx version in headers/error pages
    client_max_body_size 10M;          # generous enough for future document-upload endpoints

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ---------- Upstreams ----------
    # `keepalive` maintains a pool of persistent connections to each
    # upstream instead of opening a new TCP connection per request —
    # meaningfully reduces latency under load.
    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ---------- Security headers ----------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ---------- Backend API ----------
        location /api/ {
            proxy_pass http://backend_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;      # agent pipelines can run long
            proxy_read_timeout 120s;
        }

        # ---------- Backend docs (Swagger/ReDoc/OpenAPI) ----------
        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- Frontend (Next.js) ----------
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ---------- Health check passthrough (for load balancers) ----------
        location = /healthz {
            proxy_pass http://backend_upstream/api/v1/health;
        }
    }
}
