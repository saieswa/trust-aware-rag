# Production overrides — layer on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Connects to managed cloud Supabase PostgreSQL and Upstash Redis.

services:
  backend:
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: INFO
      LOG_JSON: "true"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  nginx:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
